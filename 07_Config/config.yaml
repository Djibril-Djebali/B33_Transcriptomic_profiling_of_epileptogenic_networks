# ==================================================
# Configuration of the workflow
# ==================================================

# ──────────────────── Global ──────────────────────

samples: samples.tsv
samples_prefix: EN00011089_

# Nomenclature for the paired-end reads
types:
  - "1" # Forward read
  - "2" # Reverse read

metadata: metadata.tsv

reference:
  # Name of the reference genome
  name: GRCh38.p14
  # Download link for the reference genome's files
  link_ref_fasta: https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.40_GRCh38.p14/GCF_000001405.40_GRCh38.p14_genomic.fna.gz
  link_ref_gtf: https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.40_GRCh38.p14/GCF_000001405.40_GRCh38.p14_genomic.gtf.gz
  # File name for the download reference genome's files
  ref_fasta: GCF_000001405.40_GRCh38.p14_genomic.fna
  ref_gtf: GCF_000001405.40_GRCh38.p14_genomic.gtf

# ─────────────────── 00_Clean ────────────────────

### FastQC ###
fastqc:
  threads: 4

### Cutadapt ###
cutadapt:
  # Whether or not to use remove primers with cutadapt
  use: true
  # Number of core to use
  thread: 4
  # Use a string for one primer, a list for multiple, or leave empty ("") to skip
  # e.g. " ", ACACTCTTTCCCTACACGACGC or [SEQ1, SEQ2]
  # 5′ primers : trimmed from the START of the read (-g / -G)
  primer_5_forward: ""
  primer_5_reverse: ""
  # 3′ primers : trimmed from the END of the read (-a / -A)
  primer_3_forward: AGATCGGAAGAGCACACGTCTGAACTCCAGTCA
  primer_3_reverse: AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT
  # Trimming parameters
  primer_err: 0.1
  primer_overlap: 10

### Trimmomatic ###
trimmomatic:
  # Whether or not to trim with trimmomatic
  use: true
  # Number of core to use
  thread: 4
  # Trimming parameters
  leading: 20
  trailing: 15
  slidingwindow_size: 4
  slidingwindow_quality: 15
  minlen: 36

# ──────────────── 01_Alignement ──────────────────

star_index:
  # Number of core to use
  threads: 12
  # In byte
  ram_limit: 50000000000
  # Ideally, this length should be equal to ReadLength-1
  # In case if varying length, the ideal value is max(ReadLength-1)
  # In most cases, the default value of 100 will work as well as the ideal value.
  sjdbOverhang: 149 

star_alignment:
  # Number of core to use
  threads: 8
  # In byte
  ram_limit: 30000000000
  # Method to use to process compressed files
  readFilesCommand: zcat
  # Max number of multiple alignments allowed for a read: if exceeded, the read is considered unmapped
  outFilterMultimapNmax: 10 
  # Improve novel junction detection (but double execution time)
  # e.g. None or Basic
  twopass: None
  # SAM tags to include
  outSAMattributes: "NH HI AS NM MD" 
  # 
  # If using a stranded library, also set 
  # featurecounts strand to 1 or 2
  # AND change outSAMstrandField to intronMotif
  # e.g. None or intronMotif
  outSAMstrandField: None

bam_index:
  # Indexing BAM files into BAI files if needed
  use: false

# ────────────────── 02_Counts ────────────────────

featurecounts:
  # Number of core to use
  threads: 8
  # Feature type to count
  # e.g exon or gene
  type: exon
  # GTF attribute to group features
  # e.g gene_id or gene_name
  group: gene_id
  # Strandness of the librairy
  # e.g 0 = unstranded, 1 = stranded (forward), 2 = reversely stranded
  strand: 0
  # Only count if both reads are mapped
  B: true
  # Discard pairs mapping to different chromosomes
  C: true
  # The minimum mapping quality score a read must satisfy in
  # order to be counted. For paired-end reads, at least one end
  # should satisfy this criteria.
  Q: 0
  # Count multi-mapping reads (uses NH tag)
  multimapped: false
  # Assign fractional counts for multi-mappers (uses with -M)
  fraction: false
  # Only count primary alignments
  primary: false
  # e.g "", "gene_name,gene_biotype" ...
  extraAttribute: "" 

cpm:
  threshold: 1
